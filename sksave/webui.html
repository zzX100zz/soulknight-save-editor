<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soul Knight Save Editor</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f24;
    --panel-2: #23272e;
    --line: #2f343c;
    --text: #e8eaed;
    --muted: #9aa3af;
    --accent: #4c8dff;
    --accent-dim: #2f5ea8;
    --ok: #35c07a;
    --warn: #e0a33a;
    --err: #e0655a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 20px 24px 12px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .lang { margin-left: auto; display: flex; gap: 6px; }
  main { padding: 20px 24px 40px; max-width: 1020px; margin: 0 auto; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
  }
  .card h2 { font-size: 13px; margin: 0 0 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 0; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill {
    display: inline-bp; display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: 12px; border: 1px solid var(--line);
  }
  .pill.ok { color: var(--ok); border-color: #23543d; background: #16261f; }
  .pill.bad { color: var(--err); border-color: #573029; background: #2a1a18; }
  .pill.warn { color: var(--warn); border-color: #574327; background: #2a2318; }
  button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #454c57; background: #282d35; }
  button.primary { background: var(--accent-dim); border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: #35619f; }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row + .row { margin-top: 10px; }
  label.check { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  input[type=number] {
    width: 130px; font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
  }
  input[type=text], select {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 200px;
  }
  #log {
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #0f1114; border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; height: 230px; overflow: auto; white-space: pre-wrap; color: #cfd4dc;
  }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1 data-i18n="title">元气骑士 iOS 存档修改器</h1>
  <span class="sub" data-i18n="sub">基于 AirLift，本地运行</span>
  <span class="lang">
    <button id="lang-zh" title="中文">中文</button>
    <button id="lang-en" title="English">EN</button>
  </span>
</header>

<main>
  <div class="grid">
    <section class="card">
      <h2 data-i18n="device">设备</h2>
      <table>
        <tr><th data-i18n="name">名称</th><td id="dev-name">-</td></tr>
        <tr><th data-i18n="model">型号</th><td id="dev-model">-</td></tr>
        <tr><th data-i18n="ios">系统</th><td id="dev-ios">-</td></tr>
        <tr><th data-i18n="link">连接</th><td id="dev-link">-</td></tr>
      </table>
      <div class="row" style="margin-top:12px">
        <button id="btn-refresh" data-i18n="refresh">刷新</button>
        <span id="dev-state" class="hint"></span>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="env">运行环境</h2>
      <table>
        <tr><th>Python</th><td id="env-venv">-</td></tr>
        <tr><th data-i18n="deps">依赖</th><td id="env-deps">-</td></tr>
        <tr><th>AirLift</th><td id="env-airlift">-</td></tr>
        <tr><th>Xcode</th><td id="env-xcode">-</td></tr>
      </table>
      <div class="row" style="margin-top:12px">
        <button id="btn-setup" class="primary" data-i18n="install">安装 / 修复环境</button>
      </div>
      <p class="hint" data-i18n="envHint">首次使用需要安装依赖并编译 AirLift，约一到两分钟。</p>
    </section>
  </div>

  <section class="card" style="margin-top:14px">
    <h2 data-i18n="state">存档状态</h2>
    <div class="row">
      <button id="btn-info" data-i18n="readSave">读取存档（不改动）</button>
      <button id="btn-backup" data-i18n="backup">备份存档</button>
      <span id="state-hint" class="hint"></span>
    </div>
    <table id="state-table" style="margin-top:12px"></table>
    <p class="hint" data-i18n="readHint">读取会把存档取出再原样写回，请先完全退出游戏。</p>
  </section>

  <section class="card" style="margin-top:14px">
    <h2 data-i18n="unlock">解锁</h2>
    <div class="row">
      <button id="btn-unlock" class="primary" data-i18n="unlockAll">解锁全部</button>
      <span id="unlock-hint" class="hint"></span>
    </div>
    <div class="row" id="options"></div>
    <div class="row">
      <label class="check"><span data-i18n="gems">宝石</span><input type="number" id="opt-gems" value="2000000000" step="1000000"></label>
      <label class="check"><span data-i18n="coin">赛季币</span><input type="number" id="opt-coin" value="9999999" step="10000"></label>
      <label class="check"><span data-i18n="qty">材料 / 种子 / 票券</span><input type="number" id="opt-qty" value="99999" step="1000"></label>
      <label class="check"><span data-i18n="heroLv">角色等级</span><input type="number" id="opt-level" value="8" min="1" max="8"></label>
    </div>
    <p class="hint" data-i18n="unlockHint">修改前会自动在 Mac 与手机里各留一份备份，写入后会逐字节校验。所有数值只升不降。</p>
  </section>

  <section class="card" style="margin-top:14px">
    <h2 data-i18n="restore">恢复备份</h2>
    <div class="row">
      <select id="backup-list"></select>
      <button id="btn-restore" data-i18n="restoreDo">恢复这个备份</button>
      <button id="btn-list" data-i18n="reload">刷新列表</button>
    </div>
    <p class="hint" data-i18n="restoreHint">列表包含 Mac 上的备份与手机 Media 里的备份；容器空了也能用后者恢复。</p>
  </section>

  <section class="card" style="margin-top:14px">
    <h2 data-i18n="logTitle">运行日志</h2>
    <div id="log"></div>
    <div class="row" style="margin-top:10px">
      <span id="job-state" class="hint"></span>
    </div>
  </section>

  <p class="hint" data-i18n="footer">
    运行期间请保持游戏完全退出、iPhone 解锁并连接。工具只写本地存档文件，不影响云存档。
  </p>
</main>

<script>
const I18N = {
  zh: {
    title: "元气骑士 iOS 存档修改器", sub: "基于 AirLift，本地运行",
    device: "设备", name: "名称", model: "型号", ios: "系统", link: "连接", refresh: "刷新",
    env: "运行环境", deps: "依赖", install: "安装 / 修复环境",
    envHint: "首次使用需要安装依赖并编译 AirLift，约一到两分钟。",
    state: "存档状态", readSave: "读取存档（不改动）", backup: "备份存档",
    readHint: "读取会把存档取出再原样写回，请先完全退出游戏。",
    unlock: "解锁", unlockAll: "解锁全部", gems: "宝石", coin: "赛季币",
    qty: "材料 / 种子 / 票券", heroLv: "角色等级",
    unlockHint: "修改前会自动在 Mac 与手机里各留一份备份，写入后会逐字节校验。所有数值只升不降。",
    restore: "恢复备份", restoreDo: "恢复这个备份", reload: "刷新列表",
    restoreHint: "列表包含 Mac 上的备份与手机 Media 里的备份；容器空了也能用后者恢复。",
    logTitle: "运行日志", footer: "运行期间请保持游戏完全退出、iPhone 解锁并连接。工具只写本地存档文件，不影响云存档。",
    running: "运行中", done: "完成", failed: "失败", idle: "空闲",
    ready: "就绪", missing: "缺失", installing: "安装中",
    rows: {
      heroes: "角色未解锁", pets: "宠物未解锁", skinsUnlocked: "已解锁皮肤",
      skillsUnlocked: "已解锁技能", weaponsUnlocked: "已解锁武器", weaponsCatalog: "武器总数",
      evolution: "已进化武器", killEffects: "击败特效", gems: "宝石", seasonCoin: "赛季币",
      switches: "格式开关", legacyFiles: "未清理的新格式文件"
    },
    options: {
      heroes: "角色", hero_levels: "角色等级", skins: "皮肤", pets: "宠物", skills: "技能",
      weapons: "武器", weapon_skins: "武器皮肤", evolution: "武器进化", kill_effects: "击败特效",
      mythic: "神话武器", materials: "材料", season_coin: "赛季币", gems: "宝石", repair_format: "修复存档格式"
    },
    pickDevice: "选择设备", noDevice: "未找到已配对的 iPhone",
    confirmRestore: "确定要用这个备份覆盖手机上的存档吗？"
  },
  en: {
    title: "Soul Knight iOS Save Editor", sub: "runs locally, built on AirLift",
    device: "Device", name: "Name", model: "Model", ios: "iOS", link: "Connection", refresh: "Refresh",
    env: "Environment", deps: "Dependencies", install: "Install / repair environment",
    envHint: "The first run installs the dependencies and builds AirLift, about a minute or two.",
    state: "Save state", readSave: "Read the save (no changes)", backup: "Back up the save",
    readHint: "Reading moves the save out and writes it back unchanged; quit the game first.",
    unlock: "Unlock", unlockAll: "Unlock everything", gems: "Gems", coin: "Season coins",
    qty: "Materials / seeds / tickets", heroLv: "Hero level",
    unlockHint: "A backup is kept on the Mac and on the phone before anything is written, and the result is verified byte for byte. Values are never lowered.",
    restore: "Restore a backup", restoreDo: "Restore this backup", reload: "Reload the list",
    restoreHint: "The list covers backups on the Mac and in the phone's Media folder; the latter works even when the container is empty.",
    logTitle: "Log", footer: "Keep the game closed and the iPhone unlocked and connected while this runs. Only local save files are written; cloud saves are untouched.",
    running: "running", done: "done", failed: "failed", idle: "idle",
    ready: "ready", missing: "missing", installing: "installing",
    rows: {
      heroes: "heroes locked", pets: "pets locked", skinsUnlocked: "skins unlocked",
      skillsUnlocked: "skills unlocked", weaponsUnlocked: "weapons unlocked", weaponsCatalog: "weapons known",
      evolution: "weapons evolved", killEffects: "kill effects", gems: "gems", seasonCoin: "season coins",
      switches: "format switches", legacyFiles: "uncleaned new-format files"
    },
    options: {
      heroes: "heroes", hero_levels: "hero levels", skins: "skins", pets: "pets", skills: "skills",
      weapons: "weapons", weapon_skins: "weapon skins", evolution: "weapon evolution", kill_effects: "kill effects",
      mythic: "mythic weapons", materials: "materials", season_coin: "season coins", gems: "gems", repair_format: "save format repair"
    },
    pickDevice: "Pick a device", noDevice: "no paired iPhone found",
    confirmRestore: "Overwrite the save on the phone with this backup?"
  }
};
let lang = localStorage.getItem("sksave-lang") || (navigator.language.startsWith("zh") ? "zh" : "en");
const t = (key) => I18N[lang][key] ?? key;
const $ = (id) => document.getElementById(id);

function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach((node) => {
    const value = t(node.dataset.i18n);
    if (typeof value === "string") node.textContent = value;
  });
  $("lang-zh").style.borderColor = lang === "zh" ? "var(--accent)" : "var(--line)";
  $("lang-en").style.borderColor = lang === "en" ? "var(--accent)" : "var(--line)";
  renderOptions();
  renderState(state);
  localStorage.setItem("sksave-lang", lang);
}

/* options come from the server so the UI cannot drift from the CLI */
let optionNames = [];
function renderOptions() {
  const box = $("options");
  box.innerHTML = "";
  optionNames.forEach((name) => {
    const label = document.createElement("label");
    label.className = "check";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.id = "opt-" + name;
    input.checked = true;
    label.append(input, document.createTextNode(I18N[lang].options[name] || name));
    box.append(label);
  });
}

function pill(text, kind) { return `<span class="pill ${kind || ""}">${text}</span>`; }
function num(value) { return value === null || value === undefined ? "-" : Number(value).toLocaleString(); }

async function api(path, body) {
  const response = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: body ? { "Content-Type": "application/json", "X-Requested-With": "sksave" } : {},
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

async function startJob(name, payload) {
  try {
    const data = await api("/api/job", { name, ...(payload || {}) });
    poll(data.id);
  } catch (error) {
    appendLog("error: " + error.message);
  }
}

let logCursor = 0, currentJob = null;
function appendLog(text) {
  const box = $("log");
  box.textContent += text;
  box.scrollTop = box.scrollHeight;
}

function setBusy(busy) {
  ["btn-refresh", "btn-setup", "btn-info", "btn-backup", "btn-unlock", "btn-restore", "btn-list"]
    .forEach((id) => { $(id).disabled = busy; });
}

async function poll(id) {
  if (!id) return;
  currentJob = id;
  const data = await api(`/api/job?id=${id}&cursor=${logCursor}`);
  logCursor = data.cursor;
  if (data.log) appendLog(data.log);
  $("job-state").innerHTML =
    (data.status === "running" ? '<span class="spinner"></span> ' : "") +
    `${data.name}: ${t(data.status)}`;
  setBusy(data.status === "running");
  if (data.status === "running") {
    setTimeout(() => poll(id), 700);
  } else {
    await refreshAll();
    if (data.status === "failed") appendLog("\n" + t("failed") + "\n");
  }
}

let state = null;
function renderState(snapshot) {
  state = snapshot;
  const table = $("state-table");
  if (!snapshot) { table.innerHTML = ""; return; }
  const fx = snapshot.legacyFlags || {};
  const rows = [
    ["heroes", snapshot.heroes.locked],
    ["pets", snapshot.pets.locked],
    ["skinsUnlocked", snapshot.skins.prefsUnlocked + " / " + snapshot.skins.entries],
    ["skillsUnlocked", (snapshot.skills.entries - snapshot.skills.locked) + " / " + snapshot.skills.entries],
    ["weaponsUnlocked", snapshot.weapons.unlocked + " / " + snapshot.weapons.catalog],
    ["evolution", snapshot.weapons.evolved + " / " + snapshot.weapons.evolutionEntries],
    ["killEffects", snapshot.killEffects],
    ["gems", num(snapshot.gems)],
    ["seasonCoin", num(snapshot.seasonCoin)],
    ["switches", Object.entries(fx).map(([k, v]) => k.split("_").slice(-1) + "=" + v).join("  ")],
    ["legacyFiles", snapshot.legacyFiles.length]
  ];
  table.innerHTML = rows
    .map(([key, value]) => `<tr><th>${I18N[lang].rows[key] || key}</th><td class="num">${value}</td></tr>`)
    .join("");
}

async function refreshStatus() {
  const data = await api("/api/status");
  const device = data.devices[0];
  $("dev-name").textContent = device ? device.name : t("noDevice");
  $("dev-model").textContent = device ? device.product : "-";
  $("dev-ios").textContent = device ? "iOS " + device.version : "-";
  $("dev-link").textContent = device ? device.transport : "-";
  $("env-venv").innerHTML = data.environment.venv ? pill(t("ready"), "ok") : pill(t("missing"), "warn");
  $("env-deps").innerHTML = data.environment.dependencies ? pill(t("ready"), "ok") : pill(t("missing"), "warn");
  $("env-airlift").innerHTML = data.environment.airlift ? pill(t("ready"), "ok") : pill(t("missing"), "warn");
  $("env-xcode").innerHTML = data.environment.xcode ? pill(t("ready"), "ok") : pill(t("missing"), "bad");
  $("btn-unlock").disabled = !data.environment.dependencies || !device;
  $("btn-info").disabled = !data.environment.dependencies || !device;
  $("btn-backup").disabled = !data.environment.dependencies || !device;
  optionNames = data.options;
  renderOptions();
  $("dev-state").textContent = data.job.status === "running" ? t("running") : "";
}

async function loadBackups() {
  const data = await api("/api/backups");
  const list = $("backup-list");
  list.innerHTML = "";
  [...data.local.map((p) => [p, "Mac"]), ...data.device.map((p) => [p, "iPhone"])]
    .forEach(([value, tag]) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = `${tag}: ${value.split("/").pop()}`;
      option.dataset.kind = tag === "Mac" ? "local" : "device";
      list.append(option);
    });
  if (!list.options.length) {
    const option = document.createElement("option");
    option.textContent = "(none)";
    list.append(option);
  }
}

async function refreshAll() {
  await refreshStatus().catch(() => {});
  await loadBackups().catch(() => {});
}

$("btn-refresh").onclick = refreshAll;
$("btn-setup").onclick = () => startJob("setup");
$("btn-info").onclick = () => { logCursor = 0; $("log").textContent = ""; startJob("info"); };
$("btn-backup").onclick = () => startJob("backup", { label: "ui" });
$("btn-list").onclick = loadBackups;
$("btn-unlock").onclick = () => {
  logCursor = 0; $("log").textContent = "";
  const options = {};
  optionNames.forEach((name) => { options[name] = $("opt-" + name).checked; });
  startJob("unlock", {
    options,
    gems: Number($("opt-gems").value),
    seasonCoin: Number($("opt-coin").value),
    quantity: Number($("opt-qty").value),
    heroLevel: Number($("opt-level").value)
  });
};
$("btn-restore").onclick = () => {
  const option = $("backup-list").selectedOptions[0];
  if (!option || !option.value) return;
  if (!confirm(t("confirmRestore"))) return;
  startJob("restore", { source: option.value, kind: option.dataset.kind });
};
$("lang-zh").onclick = () => { lang = "zh"; applyLang(); };
$("lang-en").onclick = () => { lang = "en"; applyLang(); };

applyLang();
refreshAll();
api("/api/job").then((data) => { if (data.status === "running") poll(data.id); });
</script>
</body>
</html>
